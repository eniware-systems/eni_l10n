name: eni_l10n_example
description: Example app to test the eni_l10n package.
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  eni_svc:
    hosted: https://gitea.eniware-systems.de/api/packages/eni-flutter/pub
    version: ^2.0.6
  eni_l10n:
    hosted: https://gitea.eniware-systems.de/api/packages/eni-flutter/pub
    version: ^2.0.5
  eni_utils:
    hosted: https://gitea.eniware-systems.de/api/packages/eni-flutter/pub
    version: ^2.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/l10n/
dev_dependencies:
  flutter_lints: ^6.0.0
